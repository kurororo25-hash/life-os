<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>整備管理 | 生活OS</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="page-header">
    <button class="back-btn" onclick="location.href='../index.html'">◀ ホーム</button>
    <h1>🔧 整備管理</h1>
  </header>

  <main class="page-main">
    <div class="card" style="margin-bottom:12px">
      <div style="padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
        <div>
          <div style="font-size:12px;color:var(--text-sub, #888)">🚗 現在の走行距離</div>
          <div style="font-size:20px;font-weight:700" id="mileageDisplay">未設定</div>
          <div style="font-size:11px;color:var(--text-sub, #888)" id="mileageUpdatedAt"></div>
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0">
          <button class="btn btn-sm btn-ghost" onclick="toggleMileageLog()">📜 履歴</button>
          <button class="btn btn-sm btn-ghost" onclick="editMileage()">✏️ 更新</button>
        </div>
      </div>
      <div id="mileageLogContainer" class="hidden" style="padding:0 16px 12px"></div>
    </div>

    <div id="listContainer"></div>
  </main>

  <button class="fab" onclick="openModal()">＋</button>

  <div class="modal-overlay hidden" id="modalOverlay" onclick="overlayClick(event)">
    <div class="modal">
      <div class="modal-title">
        <span id="modalTitle">整備項目を追加</span>
        <button class="btn-icon" onclick="closeModal()">✕</button>
      </div>

      <div class="form-group">
        <label class="form-label">項目 ＊</label>
        <select class="form-select" id="fPreset" onchange="applyPreset()">
          <option value="">選択してください</option>
        </select>
      </div>
      <div class="form-group hidden" id="customNameGroup">
        <label class="form-label">項目名（自由入力）＊</label>
        <input type="text" class="form-input" id="fName" placeholder="例：ワイパーゴム交換">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">前回実施日（任意）</label>
          <div style="display:flex;gap:6px">
            <select class="form-select" id="fLastDateY" style="flex:1.2;min-width:0"></select>
            <select class="form-select" id="fLastDateM" style="flex:1;min-width:0"></select>
            <select class="form-select" id="fLastDateD" style="flex:1;min-width:0"></select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">前回の走行距離(km)</label>
          <input type="number" class="form-input" id="fLastKm" min="0" placeholder="例：30000">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">次回予定日</label>
          <div style="display:flex;gap:6px">
            <select class="form-select" id="fNextDateY" style="flex:1.2;min-width:0"></select>
            <select class="form-select" id="fNextDateM" style="flex:1;min-width:0"></select>
            <select class="form-select" id="fNextDateD" style="flex:1;min-width:0"></select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">次回予定の走行距離(km)</label>
          <input type="number" class="form-input" id="fNextKm" min="0" placeholder="例：35000">
        </div>
      </div>
      <div style="font-size:12px;color:var(--text-sub, #888);margin:-8px 0 12px">
        次回予定日・次回予定の走行距離は、どちらか一方または両方を入力してください
      </div>

      <div class="form-group">
        <label class="form-label">メモ</label>
        <textarea class="form-textarea" id="fNotes" placeholder="店舗名・部品番号など（任意）"></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">キャンセル</button>
        <button class="btn btn-primary" onclick="saveItem()">保存する</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="../js/storage.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/sync.js"></script>
  <script async defer src="https://accounts.google.com/gsi/client"
          onload="Sync.gisLoaded()"></script>
  <script>
    const KEY           = 'life_maintenance';
    const META_KEY      = 'life_maintenance_meta';
    const MILEAGE_LOG_KEY = 'life_mileage_log';
    let editingId  = null;

    // 項目名の候補（一般的な軽自動車・バンでよくある整備項目）
    const PRESETS = [
      'エンジンオイル交換',
      'オイルエレメント交換',
      '車検',
      'ブレーキパッド点検・交換',
      'タイヤ点検・ローテーション',
      'バッテリー交換',
      'ワイパーゴム交換',
      'エアコンフィルター交換',
      'タイヤ空気圧点検',
      'その他（自由入力）'
    ];

    // オイルとエレメントは未登録でも一覧に出す（presetはPRESETSの番号）
    const OIL_ITEMS = [
      { name: 'エンジンオイル交換', preset: 0, match: n => /オイル/.test(n) && !/エレメント|フィルター|ブレーキ/.test(n) },
      { name: 'オイルエレメント交換', preset: 1, match: n => /エレメント|オイルフィルター/.test(n) }
    ];

    // 空気圧も未登録のとき一覧に出す
    const PRESSURE_ITEM = { name: 'タイヤ空気圧点検', preset: 8, match: n => /空気圧/.test(n) };
    const PRESSURE_MONTHS = 1; // JATMAの呼びかけ「月に1度は点検」

    // 2026-11-02版で自動追加していた「安心メンテナンスパック」の項目は不要になったので消す
    function removePackItems() {
      Storage.get(KEY).filter(i => i.name === '安心メンテナンスパック').forEach(i => Storage.remove(KEY, i.id));
    }

    // 同じ名前の項目が複数あれば、前回の日付が一番新しいものだけ残す
    // （メモが空なら、消す方のメモを引き継ぐ）
    function mergeDuplicates() {
      const groups = {};
      Storage.get(KEY).forEach(i => (groups[i.name.trim()] ||= []).push(i));
      Object.values(groups).filter(g => g.length > 1).forEach(g => {
        g.sort(newerFirst);
        const [keep, ...olds] = g;
        const oldNotes = olds.find(o => o.notes);
        if (!keep.notes && oldNotes) Storage.update(KEY, keep.id, { notes: oldNotes.notes });
        olds.forEach(o => Storage.remove(KEY, o.id));
      });
    }

    function newerFirst(a, b) {
      return (b.lastDate || '').localeCompare(a.lastDate || '')
        || (b.updatedAt || b.createdAt || '').localeCompare(a.updatedAt || a.createdAt || '');
    }

    function initPresetSelect() {
      const sel = document.getElementById('fPreset');
      PRESETS.forEach((name, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = name;
        sel.appendChild(opt);
      });
    }

    function applyPreset() {
      const idx = document.getElementById('fPreset').value;
      const customGroup = document.getElementById('customNameGroup');
      if (idx === '') { customGroup.classList.add('hidden'); return; }
      const isCustom = Number(idx) === PRESETS.length - 1;
      if (isCustom) {
        customGroup.classList.remove('hidden');
        document.getElementById('fName').value = '';
      } else {
        customGroup.classList.add('hidden');
        document.getElementById('fName').value = PRESETS[idx];
      }
    }

    function getMeta() {
      try { return JSON.parse(localStorage.getItem(META_KEY) || '{}'); } catch { return {}; }
    }

    function setMeta(meta) {
      localStorage.setItem(META_KEY, JSON.stringify(meta));
    }

    function editMileage() {
      const meta = getMeta();
      const cur = meta.mileage != null ? meta.mileage : '';
      const val = prompt('現在の走行距離（km）を入力してください', cur);
      if (val === null) return;
      const num = parseInt(val);
      if (isNaN(num) || num < 0) { alert('正しい数値を入力してください'); return; }
      recordMileage(num);
      showToast('走行距離を更新しました ✓');
      renderMileage();
      renderMileageLog();
      render();
    }

    function recordMileage(num) {
      const entry = Storage.add(MILEAGE_LOG_KEY, { mileage: num });
      setMeta({ mileage: num, updatedAt: entry.createdAt });
    }

    function renderMileage() {
      const meta = getMeta();
      const el = document.getElementById('mileageDisplay');
      el.textContent = meta.mileage != null ? `${meta.mileage.toLocaleString()} km` : '未設定';
      document.getElementById('mileageUpdatedAt').textContent =
        meta.updatedAt ? `更新: ${formatDateTime(meta.updatedAt)}` : '';
    }

    // 既存ユーザーは履歴が空でも現在値があるので、初回だけ1件分を履歴として補完する
    function ensureMileageLogSeed() {
      const log = Storage.get(MILEAGE_LOG_KEY);
      const meta = getMeta();
      if (log.length === 0 && meta.mileage != null) {
        log.unshift({
          mileage: meta.mileage,
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          createdAt: meta.updatedAt || new Date().toISOString()
        });
        Storage.set(MILEAGE_LOG_KEY, log);
      }
    }

    function toggleMileageLog() {
      const container = document.getElementById('mileageLogContainer');
      container.classList.toggle('hidden');
      if (!container.classList.contains('hidden')) renderMileageLog();
    }

    function renderMileageLog() {
      const container = document.getElementById('mileageLogContainer');
      const log = Storage.get(MILEAGE_LOG_KEY);

      if (log.length === 0) {
        container.innerHTML = `<div style="font-size:12px;color:var(--text-sub, #888);padding:8px 0">記録はまだありません</div>`;
        return;
      }

      const sorted = [...log].sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
      let html = '<div style="border-top:1px solid var(--border, #eee);margin-top:4px">';
      sorted.forEach(entry => {
        html += `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px;border-bottom:1px solid var(--border, #f0f0f0)">
            <span style="color:var(--text-sub, #888)">${formatDateTime(entry.createdAt)}</span>
            <span style="display:flex;align-items:center;gap:8px">
              <strong>${Number(entry.mileage).toLocaleString()} km</strong>
              <button class="btn-icon" onclick="deleteMileageLogEntry('${entry.id}')">🗑️</button>
            </span>
          </div>`;
      });
      html += '</div>';
      container.innerHTML = html;
    }

    function deleteMileageLogEntry(id) {
      if (!confirmDelete('この走行距離の記録を削除しますか？')) return;
      Storage.remove(MILEAGE_LOG_KEY, id);
      renderMileageLog();
    }

    // 年→月→日のセレクトで日付を入力する（選ぶと自動的に次のセレクトへフォーカス移動）
    function daysInMonth(year, month) {
      return new Date(year, month, 0).getDate();
    }

    function buildDateSelect(prefix) {
      const ySel = document.getElementById(prefix + 'Y');
      const mSel = document.getElementById(prefix + 'M');
      const dSel = document.getElementById(prefix + 'D');
      const thisYear = new Date().getFullYear();

      let yHtml = '<option value="">年</option>';
      for (let y = thisYear - 5; y <= thisYear + 6; y++) yHtml += `<option value="${y}">${y}年</option>`;
      ySel.innerHTML = yHtml;

      let mHtml = '<option value="">月</option>';
      for (let m = 1; m <= 12; m++) mHtml += `<option value="${m}">${m}月</option>`;
      mSel.innerHTML = mHtml;

      updateDayOptions(prefix);

      ySel.addEventListener('change', () => { updateDayOptions(prefix); mSel.focus(); });
      mSel.addEventListener('change', () => { updateDayOptions(prefix); dSel.focus(); });
    }

    function updateDayOptions(prefix) {
      const ySel = document.getElementById(prefix + 'Y');
      const mSel = document.getElementById(prefix + 'M');
      const dSel = document.getElementById(prefix + 'D');
      const prevDay = dSel.value;
      const maxDay = (ySel.value && mSel.value) ? daysInMonth(parseInt(ySel.value), parseInt(mSel.value)) : 31;

      let dHtml = '<option value="">日</option>';
      for (let d = 1; d <= maxDay; d++) dHtml += `<option value="${d}">${d}日</option>`;
      dSel.innerHTML = dHtml;
      if (prevDay && parseInt(prevDay) <= maxDay) dSel.value = prevDay;
    }

    function getDateValue(prefix) {
      const y = document.getElementById(prefix + 'Y').value;
      const m = document.getElementById(prefix + 'M').value;
      const d = document.getElementById(prefix + 'D').value;
      if (!y || !m || !d) return '';
      return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }

    function setDateValue(prefix, dateStr) {
      const ySel = document.getElementById(prefix + 'Y');
      const mSel = document.getElementById(prefix + 'M');
      const dSel = document.getElementById(prefix + 'D');
      if (!dateStr) {
        ySel.value = '';
        mSel.value = '';
        updateDayOptions(prefix);
        dSel.value = '';
        return;
      }
      const [y, m, d] = dateStr.split('-');
      ySel.value = String(parseInt(y));
      mSel.value = String(parseInt(m));
      updateDayOptions(prefix);
      dSel.value = String(parseInt(d));
    }

    function daysBetween(fromStr, toStr) {
      const a = new Date(fromStr + 'T00:00:00');
      const b = new Date(toStr + 'T00:00:00');
      return Math.round((b - a) / 86400000);
    }

    // 月末は丸める（8/31の6か月後→2/28）
    function addMonths(dateStr, months) {
      const [y, m, d] = dateStr.split('-').map(Number);
      return localDateStr(new Date(y, m - 1 + months, Math.min(d, daysInMonth(y, m + months))));
    }

    // 空気圧は月1回自分でも見るので、一覧から今日の日付で記録できるようにする
    function markPressureChecked(id) {
      const date = today();
      const mileage = getMeta().mileage;
      Storage.update(KEY, id, {
        lastDate: date,
        lastKm: mileage != null ? mileage : null,
        nextDate: addMonths(date, PRESSURE_MONTHS)
      });
      showToast('空気圧の点検を記録しました ✓');
      render();
    }

    // 整備1件の状態（残り日数・残りkm・緊急度）を計算
    function computeStatus(item) {
      const todayStr = today();
      const meta = getMeta();

      const daysLeft = item.nextDate ? daysBetween(todayStr, item.nextDate) : null;
      const kmLeft = (item.nextKm != null && meta.mileage != null) ? item.nextKm - meta.mileage : null;

      const overdue = (daysLeft !== null && daysLeft < 0) || (kmLeft !== null && kmLeft < 0);
      const soon = !overdue && ((daysLeft !== null && daysLeft <= 14) || (kmLeft !== null && kmLeft <= 300));

      let level = 'ok';
      if (overdue) level = 'overdue';
      else if (soon) level = 'soon';

      return { daysLeft, kmLeft, level };
    }

    function openModal(id, preset) {
      editingId = id || null;
      document.getElementById('modalTitle').textContent = id ? '整備項目を編集' : '整備項目を追加';
      document.getElementById('modalOverlay').classList.remove('hidden');
      document.getElementById('customNameGroup').classList.add('hidden');

      if (id) {
        const item = Storage.get(KEY).find(i => i.id === id);
        if (item) {
          document.getElementById('fPreset').value = '';
          document.getElementById('fName').value    = item.name || '';
          setDateValue('fLastDate', item.lastDate || '');
          document.getElementById('fLastKm').value    = item.lastKm != null ? item.lastKm : '';
          setDateValue('fNextDate', item.nextDate || '');
          document.getElementById('fNextKm').value    = item.nextKm != null ? item.nextKm : '';
          document.getElementById('fNotes').value     = item.notes || '';
          document.getElementById('customNameGroup').classList.remove('hidden');
        }
      } else {
        document.getElementById('fPreset').value = preset != null ? preset : '';
        document.getElementById('fName').value = '';
        setDateValue('fLastDate', '');
        document.getElementById('fLastKm').value = '';
        setDateValue('fNextDate', '');
        document.getElementById('fNextKm').value = '';
        document.getElementById('fNotes').value = '';
        applyPreset();
      }
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.add('hidden');
      editingId = null;
    }

    function overlayClick(e) {
      if (e.target === document.getElementById('modalOverlay')) closeModal();
    }

    function saveItem() {
      const name = document.getElementById('fName').value.trim();
      const lastDate = getDateValue('fLastDate');
      const nextDate = getDateValue('fNextDate');
      const nextKmVal = document.getElementById('fNextKm').value;
      const lastKmVal = document.getElementById('fLastKm').value;

      if (!name) { alert('項目名を入力してください'); return; }
      if (!nextDate && nextKmVal === '') {
        alert('次回予定日または次回予定の走行距離のどちらかを入力してください');
        return;
      }

      const data = {
        name,
        lastDate: lastDate || '',
        lastKm: lastKmVal !== '' ? parseInt(lastKmVal) : null,
        nextDate: nextDate || '',
        nextKm: nextKmVal !== '' ? parseInt(nextKmVal) : null,
        notes: document.getElementById('fNotes').value.trim()
      };

      // 同じ名前の項目があれば、新しく足さずにそれを更新する
      const sameName = !editingId && Storage.get(KEY).find(i => i.name.trim() === name);
      if (sameName) {
        if (!data.notes) data.notes = sameName.notes || '';
        Storage.update(KEY, sameName.id, data);
        showToast('登録済みの項目を更新しました ✓');
      } else if (editingId) {
        Storage.update(KEY, editingId, data);
        showToast('更新しました ✓');
      } else {
        Storage.add(KEY, data);
        showToast('追加しました ✓');
      }
      // 前回の距離の方が大きければ、現在の走行距離も合わせる（巻き戻しはしない）
      const mileage = getMeta().mileage;
      if (data.lastKm != null && (mileage == null || data.lastKm > mileage)) {
        recordMileage(data.lastKm);
        renderMileage();
      }
      closeModal();
      render();
    }

    function deleteItem(id) {
      if (!confirmDelete('この整備項目を削除しますか？')) return;
      Storage.remove(KEY, id);
      showToast('削除しました');
      render();
    }

    function levelBadge(level) {
      if (level === 'overdue') return '<span class="badge badge-danger">期限切れ</span>';
      if (level === 'soon')    return '<span class="badge badge-warning">まもなく</span>';
      return '';
    }

    // 今年なら「12月2日（水）」、別の年なら「2028年11月2日（木）」
    function fmtDate(dateStr) {
      const y = dateStr.slice(0, 4);
      return (y === today().slice(0, 4) ? '' : `${y}年`) + formatDate(dateStr);
    }

    // 「前回 11月2日（月）・45,000km（その後 2,500km走行）」
    function lastInfo(item) {
      const parts = [];
      if (item.lastDate) parts.push(fmtDate(item.lastDate));
      if (item.lastKm != null) {
        const mileage = getMeta().mileage;
        const since = mileage != null && mileage > item.lastKm
          ? `（その後 ${(mileage - item.lastKm).toLocaleString()}km走行）`
          : '';
        parts.push(`${item.lastKm.toLocaleString()}km${since}`);
      } else if (OIL_ITEMS.some(o => o.match(item.name))) {
        parts.push('距離未入力');
      }
      return parts.length ? `前回 ${parts.join('・')}` : '前回 記録なし';
    }

    // 「次回 12月2日（水）・あと29日」「次回 48,000km・あと3,000km」
    function nextInfo(item, status) {
      const parts = [];
      if (item.nextDate) {
        parts.push(`${fmtDate(item.nextDate)}・${status.daysLeft >= 0 ? `あと${status.daysLeft}日` : `${Math.abs(status.daysLeft)}日過ぎ`}`);
      }
      if (item.nextKm != null) {
        const left = status.kmLeft == null ? '' : status.kmLeft >= 0 ? `・あと${status.kmLeft.toLocaleString()}km` : `・${Math.abs(status.kmLeft).toLocaleString()}km超過`;
        parts.push(`${item.nextKm.toLocaleString()}km${left}`);
      }
      return `次回 ${parts.join(' / ')}`;
    }

    function itemHtml(item, status) {
      const nextColor = status.level === 'overdue' ? 'var(--danger)' : status.level === 'soon' ? 'var(--warning)' : 'var(--text)';
      return `
        <div class="list-item">
          <div class="list-item-body">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <span class="list-item-title">${esc(item.name)}</span>
              ${levelBadge(status.level)}
            </div>
            <div style="font-size:13px;font-weight:600;margin-top:4px;color:${nextColor}">${nextInfo(item, status)}</div>
            <div class="list-item-sub" style="margin-top:2px">${lastInfo(item)}</div>
            ${item.notes ? `<div class="list-item-sub" style="color:var(--text-muted)">${esc(item.notes)}</div>` : ''}
            ${PRESSURE_ITEM.match(item.name) ? `<button class="btn btn-sm btn-ghost" style="margin-top:8px" onclick="markPressureChecked('${item.id}')">✅ 今日点検した</button>` : ''}
          </div>
          <div style="display:flex;gap:4px;align-items:center;flex-shrink:0">
            <button class="btn-icon" onclick="openModal('${item.id}')">✏️</button>
            <button class="btn-icon" onclick="deleteItem('${item.id}')">🗑️</button>
          </div>
        </div>`;
    }

    // 上：期限切れ・まもなくの項目（期限が近い順）
    // 下：それ以外を、最近やった順（前回の日付が新しい順）
    function render() {
      const items = Storage.get(KEY);
      const container = document.getElementById('listContainer');
      const withStatus = items.map(item => ({ item, status: computeStatus(item) }));

      const urgent = withStatus.filter(w => w.status.level !== 'ok');
      const levelOrder = { overdue: 0, soon: 1 };
      urgent.sort((a, b) => {
        if (levelOrder[a.status.level] !== levelOrder[b.status.level]) {
          return levelOrder[a.status.level] - levelOrder[b.status.level];
        }
        const aDays = a.status.daysLeft, bDays = b.status.daysLeft;
        if (aDays !== null && bDays !== null) return aDays - bDays;
        if (aDays !== null) return -1;
        if (bDays !== null) return 1;
        return (a.status.kmLeft ?? 0) - (b.status.kmLeft ?? 0);
      });

      const rest = withStatus.filter(w => w.status.level === 'ok');
      rest.sort((a, b) => newerFirst(a.item, b.item));

      const unregistered = [...OIL_ITEMS, PRESSURE_ITEM].filter(o => !items.some(i => o.match(i.name)));

      let html = '';
      if (urgent.length) {
        html += '<div class="section-title">🔔 そろそろやる</div><div class="card">'
          + urgent.map(w => itemHtml(w.item, w.status)).join('') + '</div>';
      }
      if (rest.length) {
        html += '<div class="section-title">🕘 最近やった順</div><div class="card">'
          + rest.map(w => itemHtml(w.item, w.status)).join('') + '</div>';
      }
      if (unregistered.length) {
        html += '<div class="section-title">未登録</div><div class="card">' + unregistered.map(o => `
          <div class="list-item" style="align-items:center">
            <div class="list-item-body"><span class="list-item-title" style="color:var(--text-sub)">${o.name}</span></div>
            <button class="btn btn-sm btn-ghost" style="flex-shrink:0" onclick="openModal(null, ${o.preset})">＋ 登録</button>
          </div>`).join('') + '</div>';
      }
      container.innerHTML = html;
    }

    initPresetSelect();
    buildDateSelect('fLastDate');
    buildDateSelect('fNextDate');
    ensureMileageLogSeed();
    removePackItems();
    mergeDuplicates();
    renderMileage();
    render();
  </script>
</body>
</html>
